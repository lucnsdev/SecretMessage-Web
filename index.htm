<html>

<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>@lucns - Enviar mensagem</title>
	<link rel="icon" type="image/png" href="images/favicon.png">
	<link rel="stylesheet" href="interfaces/style.css">
	<script src="interfaces/scripts.js"></script>
</head>

<body>
	<div class="div_root">
		<div class="div_card">
			<div class="horizontal_align_items">
				<img src="images/lucns.png" alt="Imagem de perfil" class="profile_image">
				<div class="margin_horizontal_16">
					<p class="user_name">@lucns</p>
					<p class="user_description">Me envie uma mensagem. Vou receber em tempo real no smartphone.</p>
					<div class="divider margin_top_8"></div>
					<div class="horizontal_align_items margin_top_8">
					</div>
					<div class="horizontal_align_items">
						<p class="text_bold">Status:</p>
						<div class="margin_left_8">
							<p class="text_regular margin_left_8">Ativo</p>
						</div>
					</div>
				</div>
			</div>
			<div class="margin_top_32">
				<form>
					<div class="div_textarea">
						<div class="margin_left_8">
							<p class="text_regular margin_left_8">Mensagem:</p>
						</div>
						<div class="margin_top_16"><textarea type="text" id="textarea_message" maxlength="1024"
								placeholder="Escreva algo aqui (Max. 1024 caracteres)."></textarea></div>
						<div class="div_counter margin_top_16 margin_right_8">
							<p id="text_counter" class="text_counter">0/1024</p>
						</div>
					</div>
					<div class="div_button">
						<button id="button" type="button" disabled>Enviar</button>
					</div>
				</form>
			</div>
		</div>
		<div class="bottom_right_overlay">
			<button id="button_dev" class="button_dev" type="button">Desenvolvido por @lucns</button>
		</div>
	</div>
</body>

</html>
